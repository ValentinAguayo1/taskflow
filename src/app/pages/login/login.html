<div class="login-page">
  <div class="login-atmosphere" aria-hidden="true"></div>

  <div class="login-shell">
    <header class="login-brand">
      <p class="logo">Task<span>Flow</span></p>
      <h1>{{ isRegistering ? 'Crear cuenta' : 'Iniciar sesión' }}</h1>
      <p class="subtitle">
        {{ isRegistering
          ? 'Regístrate para guardar tu lista.'
          : 'Accede a tus tareas.'
        }}
      </p>
    </header>

    <form class="login-form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          [attr.autocomplete]="isRegistering ? 'new-password' : 'current-password'"
          required
        />
      </div>

      @if (errorMessage) {
        <p class="error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" class="submit" [disabled]="loading">
        {{ loading
          ? 'Cargando…'
          : (isRegistering ? 'Crear cuenta' : 'Entrar')
        }}
      </button>
    </form>

    <p class="switch">
      {{ isRegistering ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?' }}
      <button type="button" class="link" (click)="toggleMode()">
        {{ isRegistering ? 'Inicia sesión' : 'Regístrate' }}
      </button>
    </p>
  </div>
</div>
